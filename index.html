<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" content="#080810">
<title>KILLUA // SYSTEM</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --void: #000000;
  --abyss: #080810;
  --deep: #0d0d18;
  --surface: rgba(17,17,32,0.85);
  --card: rgba(20,20,40,0.75);
  --lift: #1a1a35;
  --border: rgba(180,180,220,0.07);
  --border2: rgba(180,180,220,0.13);
  --border3: rgba(180,180,220,0.22);
  --text: #dcdce8;
  --text2: #7878a0;
  --text3: #3a3a58;
  --ice: #a8c8e8;
  --ice2: #7098c8;
  --ice3: #3868a8;
  --silver: #c8c8d8;
  --glow: rgba(168,200,232,0.12);
  --glow2: rgba(168,200,232,0.06);
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
html { height: 100%; height: -webkit-fill-available; }
body { height: 100%; min-height: -webkit-fill-available; background: var(--abyss); color: var(--text); font-family: 'Rajdhani', sans-serif; font-size: 15px; overscroll-behavior: none; }

/* ── HERO ── */
.hero {
  position: relative;
  height: 52vh;
  min-height: 260px;
  overflow: hidden;
  flex-shrink: 0;
}
.hero-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  filter: grayscale(100%) contrast(1.1) brightness(0.7);
  transform: scale(1.04);
  transition: transform 8s ease;
}
.hero-img:hover { transform: scale(1.0); }
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(8,8,16,0.2) 0%,
    rgba(8,8,16,0.4) 40%,
    rgba(8,8,16,0.85) 75%,
    var(--abyss) 100%
  );
}
.hero-overlay2 {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(8,8,16,0.6) 0%, transparent 60%);
}

/* scan line effect */
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
  pointer-events: none;
}

.hero-content {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 0 20px 20px;
}
.hero-tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--ice2);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 6px;
  opacity: 0.8;
}
.hero-title {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1;
  color: var(--silver);
}
.hero-title span {
  color: var(--ice);
  font-weight: 300;
}
.hero-sub {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 2px;
  margin-top: 6px;
}

/* ── GLASS HEADER ── */
.header {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 48px 20px 14px;
  background: linear-gradient(180deg, rgba(8,8,16,0.9) 0%, transparent 100%);
  z-index: 10;
}
.logo {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--ice);
  text-transform: uppercase;
}
.status-dot {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text3);
}
.dot-live {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ice2);
  box-shadow: 0 0 6px var(--ice2);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── APP ── */
.app { display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }

/* ── ПРОГРЕСС ── */
.progress-section {
  padding: 0 20px 14px;
  background: var(--abyss);
}
.prog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.prog-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 2px;
}
.prog-pct {
  font-family: 'Share Tech Mono', monospace;
  font-size: 14px;
  color: var(--ice);
  font-weight: 400;
}
.prog-track {
  height: 2px;
  background: rgba(168,200,232,0.08);
  position: relative;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ice3), var(--ice));
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.prog-fill::after {
  content: '';
  position: absolute;
  right: 0; top: -1px;
  width: 4px; height: 4px;
  background: var(--ice);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--ice);
}

/* ── TABS ── */
.tabs {
  display: flex;
  padding: 0 20px;
  gap: 0;
  border-bottom: 0.5px solid var(--border);
  background: var(--abyss);
}
.tab {
  flex: 1;
  padding: 10px 0;
  background: none;
  border: none;
  border-bottom: 1.5px solid transparent;
  color: var(--text3);
  font-family: 'Rajdhani', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: -0.5px;
}
.tab.active {
  color: var(--ice);
  border-bottom-color: var(--ice2);
}

/* ── CONTENT ── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 14px 18px 140px;
  padding-bottom: calc(140px + env(safe-area-inset-bottom));
  background: var(--abyss);
  width: 100%;
  box-sizing: border-box;
}
.content::-webkit-scrollbar { width: 0; }
.section { display: none; }
.section.active { display: block; }

/* ── STATS ── */
.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.stat {
  background: var(--surface);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 0.5px solid var(--border2);
  border-radius: 14px;
  padding: 14px 10px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}
.stat::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--ice3), transparent);
  opacity: 0.6;
}
.stat-val {
  font-family: 'Share Tech Mono', monospace;
  font-size: 22px;
  color: var(--ice);
  line-height: 1;
}
.stat-lbl {
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 4px;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 0.5px solid var(--border2);
  border-radius: 16px;
  margin-bottom: 12px;
  position: relative;
  overflow: visible;
  transition: border-color 0.3s;
  width: 100%;
  box-sizing: border-box;
}
/*
.card-header {
  padding: 16px 20px 0;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  box-sizing: border-box;
}
.card-title {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 3px;
  text-transform: uppercase;
}
.card-body { padding: 10px 20px 18px; width: 100%; box-sizing: border-box; }

/* ── TASKS ── */
.task-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 0.5px solid var(--border);
  animation: fadeIn 0.2s ease;
}
.task-item:last-of-type { border-bottom: none; }
@keyframes fadeIn { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:none} }

.task-check {
  width: 18px; height: 18px;
  border: 1px solid var(--border3);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  position: relative;
}
.task-check::before {
  content:'';
  position:absolute;
  inset:2px;
  background: var(--ice);
  transform: scale(0);
  transition: transform 0.15s;
}
.task-check.done { border-color: var(--ice2); }
.task-check.done::before { transform: scale(1); }

.task-body { flex:1; min-width:0; }
.task-text {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.task-text.done { text-decoration: line-through; color: var(--text3); }
.task-meta { display:flex; align-items:center; gap:6px; margin-top:2px; }
.task-time {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text3);
}
.cat-badge {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  padding: 2px 6px;
  border: 0.5px solid;
  text-transform: uppercase;
}
.cat-study { border-color: rgba(168,200,232,0.3); color: var(--ice2); }
.cat-work  { border-color: rgba(168,200,232,0.2); color: var(--text2); }
.cat-health{ border-color: rgba(100,180,140,0.3); color: #80c0a0; }
.cat-rest  { border-color: rgba(200,180,100,0.2); color: #b8a870; }

.task-del {
  color: var(--text3);
  cursor: pointer;
  background: none;
  border: none;
  font-size: 16px;
  line-height: 1;
  padding: 4px;
  transition: color 0.2s;
}
.task-del:hover { color: rgba(200,80,80,0.7); }

/* ── ADD FORM ── */
.add-form { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.add-form input, .add-form select {
  width: 100%;
  padding: 10px 12px;
  background: var(--card);
  border: 0.5px solid var(--border2);
  color: var(--text);
  font-size: 14px;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 500;
  outline: none;
  transition: border-color 0.2s;
  border-radius: 8px;
  appearance: none;
}
.add-form input:focus, .add-form select:focus { border-color: var(--ice3); }
.add-form input::placeholder { color: var(--text3); font-weight: 400; }
.add-form select option { background: var(--card); }
.add-form .row2 { display:flex; gap:8px; }
.add-form .row2 > * { flex:1; }

.btn-add {
  width: 100%;
  padding: 12px;
  background: transparent;
  border: 0.5px solid var(--ice3);
  color: var(--ice);
  font-family: 'Rajdhani', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  border-radius: 8px;
}
.btn-add::before {
  content:'';
  position:absolute;
  inset:0;
  background: var(--ice3);
  opacity: 0;
  transition: opacity 0.2s;
}
.btn-add:hover::before { opacity: 0.15; }
.btn-add:active { transform: scale(0.98); }

/* ── HABITS ── */
.days-row {
  display: flex;
  gap: 4px;
  justify-content: flex-end;
  padding-right: 42px;
  margin-bottom: 6px;
}
.day-lbl {
  width: 28px;
  text-align: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 0;
}
.day-lbl.today-lbl { color: var(--ice2); }

.habit-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--border);
  animation: fadeIn 0.2s ease;
}
.habit-row:last-of-type { border-bottom: none; }
.habit-name {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.5px;
}
.habit-dots { display:flex; gap:4px; flex-shrink:0; }
.dot {
  width: 28px; height: 28px;
  border: 0.5px solid var(--border2);
  border-radius: 6px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 8px;
  color: var(--text3);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
}
.dot.done { background: var(--ice3); border-color: var(--ice3); color: var(--ice); }
.dot.today { border-color: var(--ice2); color: var(--ice2); }
.streak {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--ice2);
  min-width: 28px;
  text-align: right;
}

/* ── BOTTOM FAB ── */
.bottom-add {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  padding: 16px 20px 32px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
  background: linear-gradient(0deg, var(--abyss) 60%, transparent 100%);
}
.fab {
  width: 100%;
  padding: 14px;
  background: var(--surface);
  border: 0.5px solid var(--border3);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  border-radius: 12px;
}
.fab::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--ice2), transparent);
  opacity: 0.5;
}
.fab:active { transform: scale(0.99); }
.fab.open { border-color: var(--border); color: var(--text3); }

/* ── SLIDE PANEL ── */
.overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 99; display: none;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.overlay.open { display: block; }
.panel {
  position: fixed; bottom: 0; left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%; max-width: 480px;
  background: var(--deep);
  border-top: 0.5px solid var(--border3);
  border-radius: 20px 20px 0 0;
  padding: 20px 20px 40px;
  z-index: 100;
  transition: transform 0.3s cubic-bezier(.4,0,.2,1);
}
.panel.open { transform: translateX(-50%) translateY(0); }
.panel-handle {
  width: 32px; height: 2px;
  background: var(--border2);
  margin: 0 auto 16px;
}
.panel-title {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--ice2);
  text-transform: uppercase;
  margin-bottom: 14px;
}

/* ── EMPTY ── */
.empty {
  text-align: center;
  padding: 28px 16px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--text3);
  letter-spacing: 0.5px;
  line-height: 1.8;
  width: 100%;
  box-sizing: border-box;
}

/* ── ANIM ── */
@keyframes slideDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:none} }
.hero { animation: slideDown 0.6s ease; }

/* ── CHECK-IN ── */
.checkin-card {
  background: var(--surface);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 0.5px solid var(--border2);
  border-radius: 16px;
  margin-bottom: 12px;
  overflow: hidden;
}
.checkin-header {
  padding: 14px 16px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.checkin-title {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 3px;
  text-transform: uppercase;
}
.checkin-body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.ci-row { display: flex; flex-direction: column; gap: 6px; }
.ci-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--text2); letter-spacing: 1.5px; }
.mood-row { display: flex; gap: 8px; }
.mood-btn {
  flex: 1;
  padding: 8px 0;
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: 10px;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mood-btn.active {
  background: rgba(112,152,200,0.2);
  border-color: var(--ice2);
  transform: scale(1.08);
}
.stress-row { display: flex; align-items: center; gap: 10px; }
.stress-val {
  font-family: 'Share Tech Mono', monospace;
  font-size: 14px;
  color: var(--ice);
  min-width: 24px;
  text-align: right;
}
input[type=range] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 3px;
  background: var(--border2);
  border-radius: 99px;
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--ice2);
  cursor: pointer;
  box-shadow: 0 0 8px rgba(112,152,200,0.4);
  -webkit-transition: -webkit-transform 0.15s;
  transition: transform 0.15s;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 3px;
  background: var(--border2);
  border-radius: 99px;
}
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.2); }
.ci-textarea {
  -webkit-appearance: none;
  width: 100%;
  background: var(--card);
  border: 0.5px solid var(--border2);
  border-radius: 10px;
  color: var(--text);
  font-size: 13px;
  font-family: 'Rajdhani', sans-serif;
  padding: 10px 12px;
  resize: none;
  outline: none;
  line-height: 1.5;
  transition: border-color 0.2s;
  min-height: 72px;
}
.ci-textarea:focus { border-color: var(--ice3); }
.ci-textarea::placeholder { color: var(--text3); font-size: 12px; }
.ci-save-btn {
  width: 100%;
  padding: 11px;
  background: rgba(56,104,168,0.15);
  border: 0.5px solid var(--ice3);
  border-radius: 10px;
  color: var(--ice2);
  font-family: 'Rajdhani', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}
.ci-save-btn:active { transform: scale(0.98); background: rgba(56,104,168,0.25); }
.ci-saved-tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--ice3);
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity 0.4s;
}
.ci-saved-tag.show { opacity: 1; }

/* ── WEEKLY ANALYTICS ── */
.analytics-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.analytic-chip {
  flex: 1;
  background: var(--surface);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 0.5px solid var(--border2);
  border-radius: 14px;
  padding: 12px 10px;
  text-align: center;
}
.ac-emoji { font-size: 18px; line-height: 1; }
.ac-val {
  font-family: 'Share Tech Mono', monospace;
  font-size: 18px;
  color: var(--ice);
  margin-top: 4px;
}
.ac-lbl {
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 2px;
}

</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closePanel()"></div>

<div class="app">
  <!-- HERO -->
  <div class="hero">
    <div class="header">
      <div class="logo">KILLUA // PLANNER</div>
      <div class="status-dot">
        <div class="dot-live"></div>
        <span id="today-label"></span>

    <button class="tab" onclick="switchTab('habits')">ПРИВЫЧКИ</button>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <!-- TASKS -->
    <div id="tasks" class="section active">
      <div class="analytics-row">
        <div class="analytic-chip">
          <div class="ac-emoji">🙂</div>
          <div class="ac-val" id="avg-mood">—</div>
          <div class="ac-lbl">настроение</div>
        </div>
        <div class="analytic-chip">
          <div class="ac-emoji">📉</div>
          <div class="ac-val" id="avg-stress">—</div>
          <div class="ac-lbl">стресс</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-val" id="s-total">0</div><div class="stat-lbl">всего</div></div>
        <div class="stat"><div class="stat-val" id="s-done">0</div><div class="stat-lbl">готово</div></div>
        <div class="stat"><div class="stat-val" id="s-left">0</div><div class="stat-lbl">осталось</div></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">СПИСОК ЗАДАЧ</span></div>
        <div class="card-body"><div id="task-list"></div></div>
      </div>
    </div>

    <div class="checkin-card">
      <div class="checkin-header">
        <span class="checkin-title">ИТОГ ДНЯ</span>
        <span class="ci-saved-tag" id="ci-saved">СОХРАНЕНО ✓</span>
      </div>
      <div class="checkin-body">
        <div class="ci-row">
          <div class="ci-label">НАСТРОЕНИЕ</div>
          <div class="mood-row">
            <button class="mood-btn" data-mood="1" onclick="setMood(1)">😞</button>
            <button class="mood-btn" data-mood="2" onclick="setMood(2)">🙁</button>
            <button class="mood-btn" data-mood="3" onclick="setMood(3)">😐</button>
            <button class="mood-btn" data-mood="4" onclick="setMood(4)">🙂</button>
            <button class="mood-btn" data-mood="5" onclick="setMood(5)">😄</button>
          </div>
        </div>
        <div class="ci-row">
          <div class="ci-label">УРОВЕНЬ СТРЕССА — <span id="stress-lbl">3</span>/5</div>
          <div class="stress-row">
            <span style="font-size:12px;color:var(--text3)">1</span>
            <input type="range" id="stress-slider" min="1" max="5" value="3" oninput="setStress(this.value)">
            <span style="font-size:12px;color:var(--text3)">5</span>
            <span class="stress-val" id="stress-val">3</span>
          </div>
        </div>
        <div class="ci-row">
          <div class="ci-label">РЕФЛЕКСИЯ</div>
          <textarea class="ci-textarea" id="ci-note" placeholder="Что сегодня сильнее всего повлияло на моё состояние — и почему?" rows="3"></textarea>
        </div>
        <button class="ci-save-btn" onclick="saveCheckin()">СОХРАНИТЬ ИТОГ ДНЯ</button>
      </div>
    </div>

    <!-- HABITS -->
    <div id="habits" class="section">
      <div class="card">
        <div class="card-header"><span class="card-title">ПРИВЫЧКИ // 7 ДНЕЙ</span></div>
        <div class="card-body">
          <div class="days-row" id="days-header"></div>
          <div id="habit-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-add">
    <button class="fab" id="fab-btn" onclick="openPanel()">+ ДОБАВИТЬ ЗАДАЧУ</button>
  </div>
</div>

<!-- PANEL -->
<div class="panel" id="panel">
  <div class="panel-handle"></div>
  <div class="panel-title" id="panel-title">НОВАЯ ЗАДАЧА</div>

  <div id="form-task" class="add-form">
    <input type="text" id="t-text" placeholder="Название задачи...">
    <div class="row2">
      <input type="time" id="t-time">
      <select id="t-cat">
        <option value="study">[ УЧЁБА ]</option>
        <option value="work">[ РАБОТА ]</option>
        <option value="health">[ ЗДОРОВЬЕ ]</option>
        <option value="rest">[ ОТДЫХ ]</option>
      </select>
    </div>
    <button class="btn-add" onclick="addTask()">ДОБАВИТЬ ЗАДАЧУ</button>
  </div>

  <div id="form-habit" class="add-form" style="display:none;">
    <input type="text" id="h-text" placeholder="Название привычки...">
    <button class="btn-add" onclick="addHabit()">ДОБАВИТЬ ПРИВЫЧКУ</button>
  </div>
</div>

<script>
const TASKS_KEY='kl_tasks_v1', HABITS_KEY='kl_habits_v1';
let tasks=[], habits=[], curTab='tasks';

function today(){ return new Date().toISOString().slice(0,10); }
function last7(){
  return Array.from({length:7},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(6-i));
    return d.toISOString().slice(0,10);
  });
}
function dayShort(s){
  const d=new Date(s+'T12:00:00');
  return ['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'][d.getDay()];
}
function formatDate(s){
  const d=new Date(s+'T12:00:00');
  const m=['ЯНВ','ФЕВ','МАР','АПР','МАЙ','ИЮН','ИЮЛ','АВГ','СЕН','ОКТ','НОЯ','ДЕК'];
  return `${d.getDate()} ${m[d.getMonth()]}`;
}

function load(){
  try{tasks=JSON.parse(localStorage.getItem(TASKS_KEY)||'[]');}catch(e){tasks=[];}
  try{habits=JSON.parse(localStorage.getItem(HABITS_KEY)||'[]');}catch(e){habits=[];}
}
function saveTasks(){ localStorage.setItem(TASKS_KEY,JSON.stringify(tasks)); }
function saveHabits(){ localStorage.setItem(HABITS_KEY,JSON.stringify(habits)); }

const catLabel={study:'УЧЁБА',work:'РАБОТА',health:'ЗДОРОВЬЕ',rest:'ОТДЫХ'};
const catCls={study:'cat-study',work:'cat-work',health:'cat-health',rest:'cat-rest'};

function esc(s){ const d=document.createElement('div');d.textContent=s;return d.innerHTML; }

function calcStreak(h){
  let s=0; const d=new Date();
  while(s<365){
    const k=d.toISOString().slice(0,10);
    if((h.done||[]).includes(k)){s++;d.setDate(d.getDate()-1);}
    else break;
  }
  return s;
}

function render(){
  const t=today();
  document.getElementById('today-label').textContent=formatDate(t);

  const todayTasks=tasks.filter(x=>x.date===t);
  const done=todayTasks.filter(x=>x.done).length;
  const total=todayTasks.length;
  const pct=total?Math.round(done/total*100):0;

  document.getElementById('s-total').textContent=total;
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-left').textContent=total-done;
  document.getElementById('pct-label').textContent=String(pct).padStart(3,'0')+'%';
  document.getElementById('prog-fill').style.width=pct+'%';

  // hero subtitle
  const phrases=['НЕЙРОСЕТИ. ДИСЦИПЛИНА. ПОБЕДА.','МИССИЯ АКТИВНА. ДЕЙСТВУЙ.','СЛАБОСТЬ — ВЫБОР. СДЕЛАЙ ДРУГОЙ.','ЗАВТРА ЛУЧШЕ — ЧЕМ ВЧЕРА.'];
  document.getElementById('hero-sub').textContent=phrases[Math.floor(Date.now()/86400000)%phrases.length];

  // tasks
  const tlist=document.getElementById('task-list');
  const sorted=[...todayTasks].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  if(!sorted.length){
    tlist.innerHTML='<div class="empty">Список пуст<br><span style="font-size:11px;opacity:0.5">Нажми + чтобы добавить задачу</span></div>';
  } else {
    tlist.innerHTML=sorted.map(t=>`
      <div class="task-item">
        <div class="task-check ${t.done?'done':''}" onclick="toggleTask('${t.id}')"></div>
        <div class="task-body">
          <div class="task-text ${t.done?'done':''}">${esc(t.text)}</div>
          <div class="task-meta">
            ${t.time?`<span class="task-time">${t.time}</span>`:''}
            <span class="cat-badge ${catCls[t.cat]||'cat-study'}">${catLabel[t.cat]||t.cat}</span>
          </div>
        </div>
        <button class="task-del" onclick="delTask('${t.id}')">×</button>
      </div>
    `).join('');
  }

  // habits
  const days=last7();
  document.getElementById('days-header').innerHTML=
    days.map(d=>`<div class="day-lbl ${d===today()?'today-lbl':''}">${dayShort(d)}</div>`).join('');

  const hlist=document.getElementById('habit-list');
  if(!habits.length){
    hlist.innerHTML='<div class="empty">Нет привычек<br><span style="font-size:11px;opacity:0.5">Нажми + чтобы добавить привычку</span></div>';
  } else {
    hlist.innerHTML=habits.map(h=>{
      const streak=calcStreak(h);
      const dots=days.map(d=>`
        <div class="dot ${(h.done||[]).includes(d)?'done':''} ${d===today()?'today':''}"
          onclick="toggleHabit('${h.id}','${d}')">${dayShort(d).slice(0,1)}</div>
      `).join('');
      return `
        <div class="habit-row">
          <div class="habit-name">${esc(h.name)}</div>
          <div class="habit-dots">${dots}</div>
          <div class="streak">${streak}Д</div>
          <button class="task-del" onclick="delHabit('${h.id}')">×</button>
        </div>
      `;
    }).join('');
  }
}

function toggleTask(id){ const t=tasks.find(x=>x.id===id); if(t){t.done=!t.done;saveTasks();render();} }
function delTask(id){ tasks=tasks.filter(x=>x.id!==id);saveTasks();render(); }
function addTask(){
  const txt=document.getElementById('t-text').value.trim();
  if(!txt)return;
  tasks.push({id:Date.now()+'',text:txt,time:document.getElementById('t-time').value,cat:document.getElementById('t-cat').value,date:today(),done:false});
  document.getElementById('t-text').value='';
  document.getElementById('t-time').value='';
  saveTasks();render();closePanel();
}
function toggleHabit(id,date){
  const h=habits.find(x=>x.id===id);
  if(!h)return;
  if(!h.done)h.done=[];
  if(h.done.includes(date))h.done=h.done.filter(d=>d!==date);
  else h.done.push(date);
  saveHabits();render();
}
function delHabit(id){ habits=habits.filter(x=>x.id!==id);saveHabits();render(); }
function addHabit(){
  const txt=document.getElementById('h-text').value.trim();
  if(!txt)return;
  habits.push({id:Date.now()+'',name:txt,done:[]});
  document.getElementById('h-text').value='';
  saveHabits();render();closePanel();
}

function switchTab(tab){
  curTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['tasks','habits'][i]===tab));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  document.getElementById('fab-btn').textContent=tab==='habits'?'+ ДОБАВИТЬ ПРИВЫЧКУ':'+ ДОБАВИТЬ ЗАДАЧУ';
}

function openPanel(){
  const isH=curTab==='habits';
  document.getElementById('panel-title').textContent=isH?'NEW HABIT':'НОВАЯ ЗАДАЧА';
  document.getElementById('form-task').style.display=isH?'none':'flex';
  document.getElementById('form-habit').style.display=isH?'flex':'none';
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('fab-btn').classList.add('open');
  document.getElementById('fab-btn').textContent='— ОТМЕНА';
  setTimeout(()=>{
    const inp=isH?document.getElementById('h-text'):document.getElementById('t-text');
    inp.focus();
  },300);
}
function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('fab-btn').classList.remove('open');
  document.getElementById('fab-btn').textContent=curTab==='habits'?'+ ДОБАВИТЬ ПРИВЫЧКУ':'+ ДОБАВИТЬ ЗАДАЧУ';
}

load(); render();

// ── CHECKIN ──
const CHECKIN_KEY = 'kl_checkin_v1';
let checkins = {};
let ciMood = 0, ciStress = 3;

function loadCheckins() {
  try { checkins = JSON.parse(localStorage.getItem(CHECKIN_KEY) || '{}'); } catch(e) { checkins = {}; }
}
function saveCheckinData() {
  localStorage.setItem(CHECKIN_KEY, JSON.stringify(checkins));
}
function setMood(v) {
  ciMood = v;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.mood) === v));
}
function setStress(v) {
  ciStress = parseInt(v);
  document.getElementById('stress-lbl').textContent = v;
  document.getElementById('stress-val').textContent = v;
}
function saveCheckin() {
  const note = document.getElementById('ci-note').value.trim();
  checkins[today()] = { mood: ciMood || null, stress: ciStress, note };
  saveCheckinData();
  const tag = document.getElementById('ci-saved');
  tag.classList.add('show');
  setTimeout(() => tag.classList.remove('show'), 2000);
  renderAnalytics();
}
function loadTodayCheckin() {
  const d = checkins[today()];
  if (!d) return;
  if (d.mood) setMood(d.mood);
  if (d.stress) { ciStress = d.stress; document.getElementById('stress-slider').value = d.stress; setStress(d.stress); }
  if (d.note) document.getElementById('ci-note').value = d.note;
}
function renderAnalytics() {
  const days = last7();
  const moods = days.map(d => checkins[d]?.mood).filter(Boolean);
  const stresses = days.map(d => checkins[d]?.stress).filter(Boolean);
  const avgMood = moods.length ? (moods.reduce((a,b) => a+b, 0) / moods.length).toFixed(1) : '—';
  const avgStress = stresses.length ? (stresses.reduce((a,b) => a+b, 0) / stresses.length).toFixed(1) : '—';
  document.getElementById('avg-mood').textContent = avgMood;
  document.getElementById('avg-stress').textContent = avgStress;
}

loadCheckins();
loadTodayCheckin();
renderAnalytics();

</script>
